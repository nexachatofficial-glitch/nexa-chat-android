name: Build NEXA CHAT Signed APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Complete Android Project & Firebase Config
        shell: python3 {0}
        run: |
          import os, pathlib

          os.makedirs("app/src/main/java/com/imr/nexachat", exist_ok=True)

          pathlib.Path("settings.gradle").write_text('''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NexaChat"
          include ':app'
          ''')

          pathlib.Path("build.gradle").write_text('''plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'com.google.gms.google-services' version '4.4.1' apply false
          }
          ''')

          pathlib.Path("gradle.properties").write_text('''org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          ''')

          pathlib.Path("app/build.gradle").write_text('''plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.imr.nexachat'
              compileSdk 34

              defaultConfig {
                  applicationId "com.imr.nexachat"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword "nexachatpass"
                      keyAlias "nexachat"
                      keyPassword "nexachatpass"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.activity:activity:1.8.2'
              implementation 'androidx.core:core:1.12.0'
              implementation platform('com.google.firebase:firebase-bom:32.8.0')
              implementation 'com.google.firebase:firebase-messaging'
          }
          ''')

          pathlib.Path("app/google-services.json").write_text('''{
            "project_info": {
              "project_number": "839828901701",
              "project_id": "nexachat-57109",
              "storage_bucket": "nexachat-57109.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:839828901701:android:09e2b35ec8f3e67de2f82c",
                  "android_client_info": {
                    "package_name": "com.imr.nexachat"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCQHsmzjgjyKCrXWIQxiSic3m9j5ouhkYU"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          ''')

          pathlib.Path("app/src/main/AndroidManifest.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="false"
                  android:label="NEXA CHAT"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NexaFirebaseMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          ''')

          pathlib.Path("app/src/main/java/com/imr/nexachat/MainActivity.java").write_text('''package com.imr.nexachat;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.ContextCompat;

          import com.google.firebase.messaging.FirebaseMessaging;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {
              public static final String CHANNEL_ID = "nexa_shutter_channel_v1";
              private static final String APP_URL = "https://secure.imrteleservices.in";
              private WebView webView;
              private ValueCallback<Uri[]> fileUploadCallback;
              private String pendingGroupIdFromNotif = null;

              private final ActivityResultLauncher<Intent> fileChooserLauncher =
                  registerForActivityResult(new ActivityResultContracts.StartActivityForResult(), result -> {
                      if (fileUploadCallback == null) return;
                      Uri[] results = WebChromeClient.FileChooserParams.parseResult(result.getResultCode(), result.getData());
                      fileUploadCallback.onReceiveValue(results);
                      fileUploadCallback = null;
                  });

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  createShutterNotificationChannel();
                  requestEssentialRuntimePermissions();

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);

                  NexaBridge bridge = new NexaBridge(this);
                  webView.addJavascriptInterface(bridge, "NexaNativeBridge");
                  webView.addJavascriptInterface(bridge, "Android");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          pushFcmTokenToWeb();
                          if (pendingGroupIdFromNotif != null && !pendingGroupIdFromNotif.isEmpty()) {
                              final String gId = pendingGroupIdFromNotif;
                              pendingGroupIdFromNotif = null;
                              webView.postDelayed(() ->
                                  webView.evaluateJavascript("if(window.openChatFromShutterNotification) window.openChatFromShutterNotification('" + gId + "');", null),
                                  900
                              );
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }

                      @Override
                      public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (fileUploadCallback != null) fileUploadCallback.onReceiveValue(null);
                          fileUploadCallback = filePathCallback;
                          try {
                              fileChooserLauncher.launch(fileChooserParams.createIntent());
                          } catch (Exception e) {
                              fileUploadCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  handleNotificationIntent(getIntent());
                  webView.loadUrl(APP_URL);
                  fetchAndStoreFcmToken();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleNotificationIntent(intent);
              }

              private void handleNotificationIntent(Intent intent) {
                  if (intent == null) return;
                  String gId = intent.getStringExtra("groupId");
                  if (gId != null && !gId.isEmpty()) {
                      if (webView != null) {
                          webView.evaluateJavascript("if(window.openChatFromShutterNotification) window.openChatFromShutterNotification('" + gId + "');", null);
                      } else {
                          pendingGroupIdFromNotif = gId;
                      }
                  }
              }

              private void fetchAndStoreFcmToken() {
                  FirebaseMessaging.getInstance().getToken().addOnCompleteListener(task -> {
                      if (!task.isSuccessful()) return;
                      String token = task.getResult();
                      if (token != null && !token.isEmpty()) {
                          getSharedPreferences("nexa_prefs", MODE_PRIVATE).edit().putString("fcm_token", token).apply();
                          pushFcmTokenToWeb();
                      }
                  });
              }

              private void pushFcmTokenToWeb() {
                  String token = getSharedPreferences("nexa_prefs", MODE_PRIVATE).getString("fcm_token", "");
                  if (token != null && !token.isEmpty() && webView != null) {
                      runOnUiThread(() ->
                          webView.evaluateJavascript("if(window.onNexaNativeFcmToken) window.onNexaNativeFcmToken('" + token + "');", null)
                      );
                  }
              }

              private void requestEssentialRuntimePermissions() {
                  List<String> needed = new ArrayList<>();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.POST_NOTIFICATIONS);
                      }
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      needed.add(Manifest.permission.CAMERA);
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      needed.add(Manifest.permission.RECORD_AUDIO);
                  }
                  if (!needed.isEmpty()) {
                      ActivityCompat.requestPermissions(this, needed.toArray(new String[0]), 101);
                  }
              }

              private void createShutterNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(
                          CHANNEL_ID,
                          "NEXA Chat Shutter Notifications",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      ch.enableVibration(true);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
              }

              public static boolean isGroupMutedOrArchivedLocally(Context ctx, String groupId) {
                  if (groupId == null || groupId.isEmpty()) return false;
                  SharedPreferences sp = ctx.getSharedPreferences("nexa_prefs", MODE_PRIVATE);
                  if (!sp.getBoolean("shutter_enabled", true)) return true;

                  try {
                      JSONArray arch = new JSONArray(sp.getString("archived_chats", "[]"));
                      for (int i = 0; i < arch.length(); i++) {
                          if (groupId.equals(arch.optString(i))) return true;
                      }
                  } catch (Exception ignored) {}

                  try {
                      JSONObject muted = new JSONObject(sp.getString("muted_groups", "{}"));
                      if (muted.has(groupId)) {
                          Object val = muted.get(groupId);
                          long until = -2;
                          if (val instanceof JSONObject) until = ((JSONObject) val).optLong("until", 0);
                          else if (val instanceof Number) until = ((Number) val).longValue();
                          else if ("always".equals(String.valueOf(val)) || "-1".equals(String.valueOf(val))) until = -1;

                          if (until == -1 || until > System.currentTimeMillis()) return true;
                      }
                  } catch (Exception ignored) {}

                  return false;
              }

              public static void displayNativeShutterNotification(Context ctx, String groupId, String title, String body) {
                  if (isGroupMutedOrArchivedLocally(ctx, groupId)) return;

                  Intent intent = new Intent(ctx, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  intent.putExtra("groupId", groupId != null ? groupId : "");

                  int notifId = (groupId != null && !groupId.isEmpty()) ? groupId.hashCode() : (int) System.currentTimeMillis();
                  PendingIntent pi = PendingIntent.getActivity(
                      ctx,
                      notifId,
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  NotificationCompat.Builder b = new NotificationCompat.Builder(ctx, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.sym_action_chat)
                      .setContentTitle(title != null ? title : "NEXA CHAT")
                      .setContentText(body != null ? body : "New Encrypted Message")
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                      .setAutoCancel(true)
                      .setContentIntent(pi);

                  NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) {
                      nm.notify("nexa_grp_" + (groupId != null ? groupId : "default"), notifId, b.build());
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              public class NexaBridge {
                  private final Context ctx;
                  NexaBridge(Context c) { this.ctx = c; }

                  @JavascriptInterface
                  public String getFcmToken() {
                      return ctx.getSharedPreferences("nexa_prefs", MODE_PRIVATE).getString("fcm_token", "");
                  }

                  @JavascriptInterface
                  public void setMutedGroups(String jsonStr) {
                      ctx.getSharedPreferences("nexa_prefs", MODE_PRIVATE).edit().putString("muted_groups", jsonStr != null ? jsonStr : "{}").apply();
                  }

                  @JavascriptInterface
                  public void setArchivedChats(String jsonStr) {
                      ctx.getSharedPreferences("nexa_prefs", MODE_PRIVATE).edit().putString("archived_chats", jsonStr != null ? jsonStr : "[]").apply();
                  }

                  @JavascriptInterface
                  public void setShutterNotificationsEnabled(boolean enabled) {
                      ctx.getSharedPreferences("nexa_prefs", MODE_PRIVATE).edit().putBoolean("shutter_enabled", enabled).apply();
                  }

                  @JavascriptInterface
                  public void setActiveChatId(String groupId) {
                      ctx.getSharedPreferences("nexa_prefs", MODE_PRIVATE).edit().putString("active_chat_id", groupId != null ? groupId : "").apply();
                  }

                  @JavascriptInterface
                  public void showGroupNotification(String groupId, String title, String body) {
                      displayNativeShutterNotification(ctx, groupId, title, body);
                  }

                  @JavascriptInterface
                  public void cancelGroupNotification(String groupId) {
                      if (groupId == null) return;
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.cancel("nexa_grp_" + groupId, groupId.hashCode());
                  }

                  @JavascriptInterface
                  public void clearAllNotifications() {
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.cancelAll();
                  }

                  @JavascriptInterface
                  public void requestNotificationPermission() {
                      runOnUiThread(MainActivity.this::requestEssentialRuntimePermissions);
                  }
              }
          }
          ''')

          pathlib.Path("app/src/main/java/com/imr/nexachat/NexaFirebaseMessagingService.java").write_text('''package com.imr.nexachat;

          import androidx.annotation.NonNull;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import java.util.Map;

          public class NexaFirebaseMessagingService extends FirebaseMessagingService {

              @Override
              public void onNewToken(@NonNull String token) {
                  super.onNewToken(token);
                  getSharedPreferences("nexa_prefs", MODE_PRIVATE).edit().putString("fcm_token", token).apply();
              }

              @Override
              public void onMessageReceived(@NonNull RemoteMessage remoteMessage) {
                  super.onMessageReceived(remoteMessage);
                  Map<String, String> data = remoteMessage.getData();
                  if (data == null || data.isEmpty()) return;

                  String groupId = data.get("groupId");
                  String title = data.get("title");
                  String body = data.get("body");

                  MainActivity.displayNativeShutterNotification(getApplicationContext(), groupId, title, body);
              }
          }
          ''')

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release-key.jks \
            -alias nexachat \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass nexachatpass \
            -keypass nexachatpass \
            -dname "CN=NexaChat, OU=IMR, O=IMR, L=City, S=State, C=IN"

      - name: Build Signed Release APK & AAB
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-CHAT-Signed-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Signed AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-CHAT-Signed-AAB
          path: app/build/outputs/bundle/release/*.aab
